<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Valentine 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(180deg, #fff0f7, #ffe6f0);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Poppins", Arial, sans-serif;
    text-align: center;
    overflow: hidden;
  }

  h1 {
    color: #b00020;
    font-size: 32px;
  }

  p {
    font-size: 18px;
  }

  .heart {
    position: fixed;
    bottom: -40px;
    font-size: 28px;
    color: #b00020;
    animation: floatUp linear infinite;
    pointer-events: none;
  }

  @keyframes floatUp {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-120vh); opacity: 0; }
  }
</style>
</head>

<body>

<div>
  <h1>Happy Valentine’s Day 💖</h1>
  <p>Gunguniiii, you mean everything to me 🥹</p>
</div>

<!-- HEARTS (ONLY HERE) -->
<div class="heart" style="left:15%; animation-duration:9s;">❤️</div>
<div class="heart" style="left:35%; animation-duration:11s;">❤️</div>
<div class="heart" style="left:55%; animation-duration:10s;">❤️</div>
<div class="heart" style="left:75%; animation-duration:12s;">❤️</div>

<audio id="music">
  <source src="song.mp3" type="audio/mpeg">
</audio>

<script>
  window.addEventListener("load", () => {
    const music = document.getElementById("music");
    music.play().catch(() => {});
  });
</script>

</body>
</html>
