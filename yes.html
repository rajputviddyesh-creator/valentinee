<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YAY 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(180deg, #fff0f7, #ffe6f0);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Poppins", Arial, sans-serif;
    text-align: center;
  }

  h1 {
    color: #b00020;
    font-size: 34px;
  }

  p {
    font-size: 18px;
  }
</style>
</head>

<body>

<div>
  <h1>YAY 💖</h1>
  <p>Gunguniiii, you just made me the happiest 🥹</p>
</div>

<audio id="music">
  <source src="song.mp3" type="audio/mpeg">
</audio>

<script>
  // music plays after YES click (browser-safe)
  window.addEventListener("load", () => {
    const music = document.getElementById("music");
    music.play().catch(() => {});
  });
</script>

</body>
</html>
