<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>The Day I Chose You 🤍</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #fff0f5, #ffe6ee);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #333;
    }

    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }

    h1 {
      color: #ff4d8d;
      margin-bottom: 10px;
    }

    .date {
      font-size: 18px;
      color: #777;
      margin-bottom: 25px;
    }

    p {
      line-height: 1.7;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>21 NOVEMBER 2025 🤍</h1>
    <div class="date">PUT YOUR DATE HERE</div>

    <p>
      That day wasn’t loud or perfect.<br>
      But it was honest.<br><br>
      And it was the moment I knew<br>
      I wanted to choose you.
    </p>
  </div>
</body>
</html>
