<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Will You Be My Valentine? 💘</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(180deg, #ffe6f0, #fff0f7);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Poppins", Arial, sans-serif;
    overflow: hidden;
    text-align: center;
  }

  .box {
    position: relative;
    width: 90vw;
    max-width: 360px;
    height: 260px;
  }

  h1 {
    color: #b00020;
    font-size: 22px;
    margin-bottom: 6px;
  }

  #msg {
    font-size: 13px;
    color: #b00020;
    min-height: 18px;
    margin-bottom: 10px;
  }

  button {
    position: absolute;
    padding: 6px 14px;     /* SMALL */
    font-size: 13px;
    height: 34px;          /* FORCE HEIGHT */
    line-height: 20px;     /* PREVENT STRETCH */
    border-radius: 18px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }

  #yes {
    background: #b00020;
    color: white;
    border: none;
    left: 50%;
    bottom: 15px;
    transform: translateX(-50%);
    z-index: 2;
  }

  #no {
    background: white;
    color: #b00020;
    border: 2px solid #b00020;
    left: 20px;
    bottom: 15px;
  }
</style>
</head>

<body>

<div class="box" id="box">
  <h1>Ritika, will you be my Valentine? 💖</h1>
  <div id="msg"></div>

  <button id="yes">Yes 💘</button>
  <button id="no">No 😔</button>
</div>

<script>
  const noBtn = document.getElementById("no");
  const box = document.getElementById("box");
  const msg = document.getElementById("msg");

  const sadTexts = [
    "Are you sure? 🥺",
    "Pleaseee 😔",
    "Think again 💔",
    "Don’t do this 😭",
    "That hurts 🥹"
  ];

  function moveNoButton() {
    const boxRect = box.getBoundingClientRect();
    const btnRect = noBtn.getBoundingClientRect();
    const padding = 12;

    const maxX = boxRect.width - btnRect.width - padding;
    const maxY = boxRect.height - btnRect.height - padding;

    noBtn.style.left = Math.random() * maxX + "px";
    noBtn.style.top = Math.random() * maxY + "px";

    msg.innerText = sadTexts[Math.floor(Math.random() * sadTexts.length)];
  }

  // desktop
  noBtn.addEventListener("mouseenter", moveNoButton);
  noBtn.addEventListener("mousemove", moveNoButton);

  // mobile
  noBtn.addEventListener("touchstart", (e) => {
    e.preventDefault();
    moveNoButton();
  });

  document.getElementById("yes").addEventListener("click", () => {
    window.location.href = "yes.html";
  });

  moveNoButton();
</script>

</body>
</html>
