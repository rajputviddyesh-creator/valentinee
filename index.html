<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Will You Be My Valentine? 💘</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(180deg, #ffe6f0, #fff0f7);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Poppins", Arial, sans-serif;
    overflow: hidden;
    text-align: center;
  }

  .box {
    position: relative;
    width: 90vw;
    max-width: 360px;
    height: 280px;
  }

  h1 {
    color: #b00020;
    margin-bottom: 10px;
  }

  #msg {
    font-size: 14px;
    color: #b00020;
    min-height: 20px;
  }

  button {
    padding: 10px 18px; /* SMALLER BUTTON */
    font-size: 14px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    position: absolute;
    user-select: none;
  }

  #yes {
    background: #b00020;
    color: white;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    z-index: 2; /* ALWAYS CLICKABLE */
  }

  #no {
    background: white;
    color: #b00020;
    border: 2px solid #b00020;
    left: 20px;
    bottom: 20px;
  }
</style>
</head>

<body>

<div class="box" id="box">
  <h1>Ritika, will you be my Valentine? 💖</h1>
  <div id="msg"></div>

  <button id="yes">Yes 💘</button>
  <button id="no">No 😔</button>
</div>

<script>
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");
  const box = document.getElementById("box");
  const msg = document.getElementById("msg");

  const sadTexts = [
    "Are you sure? 🥺",
    "Think again 😔",
    "That hurts a little 💔",
    "Pleaseee 🥹",
    "Don’t do this to me 😭"
  ];

  function moveNoButton() {
    const boxRect = box.getBoundingClientRect();
    const btnRect = noBtn.getBoundingClientRect();
    const padding = 15;

    const maxX = boxRect.width - btnRect.width - padding;
    const maxY = boxRect.height - btnRect.height - padding;

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    noBtn.style.left = randomX + "px";
    noBtn.style.top = randomY + "px";

    // show sad text
    msg.innerText = sadTexts[Math.floor(Math.random() * sadTexts.length)];
  }

  // Desktop
  noBtn.addEventListener("mouseenter", moveNoButton);
  noBtn.addEventListener("mousemove", moveNoButton);

  // Mobile
  noBtn.addEventListener("touchstart", (e) => {
    e.preventDefault();
    moveNoButton();
  });

  // YES CLICK → go to next page
  yesBtn.addEventListener("click", () => {
    window.location.href = "yes.html";
  });

  // initial position
  moveNoButton();
</script>

</body>
</html>
