<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Will You Be My Valentine? 💘</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(180deg, #ffe6f0, #fff0f7);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Poppins", Arial, sans-serif;
    overflow: hidden;
    text-align: center;
  }

  /* FLOATING HEARTS */
  .heart {
    position: fixed;
    bottom: -40px;
    font-size: 24px;
    color: #b00020;
    opacity: 0.9;
    animation: floatUp linear infinite;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes floatUp {
    from {
      transform: translateY(0);
      opacity: 1;
    }
    to {
      transform: translateY(-120vh);
      opacity: 0;
    }
  }

  .box {
    position: relative;
    width: 90vw;
    max-width: 360px;
    height: 300px;
    z-index: 2;
  }

  h1 {
    color: #b00020;
    margin-bottom: 8px;
    font-size: 22px;
  }

  #msg {
    font-size: 13px;
    color: #b00020;
    min-height: 18px;
  }

  button {
    padding: 8px 14px;   /* SMALL BUTTON */
    font-size: 13px;     /* SMALL TEXT */
    border: none;
    border-radius: 20px;
    cursor: pointer;
    position: absolute;
    user-select: none;
  }

  #yes {
    background: #b00020;
    color: white;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    z-index: 3;
  }

  #no {
    background: white;
    color: #b00020;
    border: 2px solid #b00020;
    left: 20px;
    bottom: 20px;
  }
</style>
</head>

<body>

<!-- HEARTS -->
<div class="heart" style="left:10%; animation-duration:10s;">❤️</div>
<div class="heart" style="left:25%; animation-duration:12s;">❤️</div>
<div class="heart" style="left:40%; animation-duration:9s;">❤️</div>
<div class="heart" style="left:55%; animation-duration:11s;">❤️</div>
<div class="heart" style="left:70%; animation-duration:10s;">❤️</div>
<div class="heart" style="left:85%; animation-duration:13s;">❤️</div>

<div class="box" id="box">
  <h1>Ritika, will you be my Valentine? 💖</h1>
  <div id="msg"></div>

  <button id="yes">Yes 💘</button>
  <button id="no">No 😔</button>
</div>

<script>
  const noBtn = document.getElementById("no");
  const box = document.getElementById("box");
  const msg = document.getElementById("msg");

  const sadTexts = [
    "Are you sure? 🥺",
    "Think again 😔",
    "That hurts 💔",
    "Pleaseee 🥹",
    "Don’t do this 😭"
  ];

  function moveNoButton() {
    const boxRect = box.getBoundingClientRect();
    const btnRect = noBtn.getBoundingClientRect();
    const padding = 20;

    const maxX = boxRect.width - btnRect.width - padding;
    const maxY = boxRect.height - btnRect.height - padding;

    noBtn.style.left = Math.random() * maxX + "px";
    noBtn.style.top = Math.random() * maxY + "px";

    msg.innerText = sadTexts[Math.floor(Math.random() * sadTexts.length)];
  }

  noBtn.addEventListener("mouseenter", moveNoButton);
  noBtn.addEventListener("mousemove", moveNoButton);
  noBtn.addEventListener("touchstart", (e) => {
    e.preventDefault();
    moveNoButton();
  });

  document.getElementById("yes").addEventListener("click", () => {
    window.location.href = "yes.html";
  });

  moveNoButton();
</script>

</body>
</html>
